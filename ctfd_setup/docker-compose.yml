services:
  ctfd:
    image: ctfd/ctfd:latest
    container_name: ctfd
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://ctfd:ctfd@db/ctfd
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=your-secret-key-change-this
      - UPLOAD_FOLDER=/var/uploads
      - LOG_FOLDER=/var/log/CTFd
      - ACCESS_LOG=-
      - ERROR_LOG=-
      - REVERSE_PROXY=true
      - SQLITE_DATABASE=/opt/CTFd/CTFd/db/ctfd.db
    volumes:
      - ./CTFd/uploads:/var/uploads
      - ./CTFd/logs:/var/log/CTFd
    depends_on:
      - db
      - redis
    restart: unless-stopped

  db:
    image: mariadb:10.4
    container_name: ctfd_db
    environment:
      - MYSQL_ROOT_PASSWORD=ctfd_root_password
      - MYSQL_USER=ctfd
      - MYSQL_PASSWORD=ctfd
      - MYSQL_DATABASE=ctfd
    volumes:
      - ./data/db:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: ctfd_redis
    restart: unless-stopped
